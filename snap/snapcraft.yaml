name: smollm3
title: SmolLM3
summary: Local AI with SmolLM3 inference snap
description: |
  SmolLM3 is a compact large language model (LLM) developed by Hugging Face.
  It is designed for efficient natural language tasks such as text generation,
  summarization, reasoning, and question answering.

  Use this snap to quickly install an optimized environment for local inference with SmolLM3.

  The snap includes the following hardware-optimized inference engines:

  * cpu: Optimized for x64 and ARM (armv8, armv9) CPUs
  * intel-gpu: Vulkan-enabled GPU acceleration for Intel GPUs
  * nvidia-gpu: CUDA-enabled GPU acceleration

  The most suitable engine is automatically selected based on the available hardware.

  **Install:**

  `sudo snap install smollm3`

  **Run:**

  `smollm3`

  Some accelerators require extra drivers to be usable with this snap:
  https://documentation.ubuntu.com/inference-snaps/how-to/setup/drivers/

  **License:**

  The SmolLM3 model is provided by Hugging Face under the Apache 2.0 license:
  https://huggingface.co/collections/HuggingFaceTB/smollm3

  The licenses of all the bundled software can be found after installing the snap at
  `/snap/smollm3/current/usr/share/doc`.

icon: snap/gui/icon-256.png
website: https://documentation.ubuntu.com/inference-snaps
source-code: https://github.com/canonical/smollm3-snap
issues: https://github.com/canonical/inference-snaps/issues

adopt-info: version

base: core24
grade: stable
confinement: strict
compression: lzo

assumes:
  - snapd2.68 # for components support

platforms:
  amd64:
  arm64:

slots:
  provider:
    interface: content
    content: inference-provider
    source:
      read:
        - $SNAP_COMMON/share/provider

environment:
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR

layout:
  # Under wsl the libraries are expected in /usr/lib/wsl
  /usr/lib/wsl:
    bind: $SNAP_COMMON/usr/lib/wsl

hooks:
  install:
    plugs: &install-plugs
      # For hardware detection
      - hardware-observe
      - opengl
  post-refresh:
    plugs: *install-plugs

parts:
  version:
    after: [cli]
    plugin: nil
    source: . # To regenerate the git hash on every change
    build-packages:
      - jq
      - git
    override-pull: |
      # Do nothing. This significantly reduces build time when sourcing large files.
    override-build: |
      set -eo pipefail
      cli_version=$($CRAFT_STAGE/bin/modelctl version --format=json | jq .cli --raw-output)
      git_hash=$(git -C "$SNAPCRAFT_PROJECT_DIR" describe --always)
      craftctl set version="${cli_version#v}+${git_hash}"
  cli:
    source:
      - on amd64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.18/inference-snaps-cli-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.18/inference-snaps-cli-linux-arm64.tar.xz
    plugin: dump
    override-build: |
      mv bin/modelctl bin/modelctl.real
      cat << 'EOF' > bin/modelctl
      #!/bin/bash
      if [ -n "${SNAP:-}" ] && [ -d "${SNAP}/components" ]; then
        if [ -z "${SNAP_COMPONENTS:-}" ] || [ ! -d "${SNAP_COMPONENTS}/llamacpp" ] || [ ! -d "${SNAP_COMPONENTS}/llamacpp-cuda" ] || [ ! -d "${SNAP_COMPONENTS}/llamacpp-vulkan" ] || [ ! -d "${SNAP_COMPONENTS}/smollm3-3b-q4-k-m-gguf" ]; then
          export SNAP_COMPONENTS="${SNAP}/components"
        fi
      fi
      exec -a "$0" "$(dirname "$0")/modelctl.real" "$@"
      EOF
      chmod +x bin/modelctl
      # For tab completion
      ln --symbolic ./modelctl bin/smollm3

      craftctl default

  # To build the CLI from source, replace the above part with the following:
  # If the source version is longer than 32 char, replace the versioning line with 'craftctl set version="dev"'
  # cli:
  #   # Repo checked out in the same project:
  #   # source: ./inference-snaps-cli
  #   # Repo from GitHub:
  #   source: https://github.com/canonical/inference-snaps-cli.git
  #   source-branch: <branch>
  #   plugin: go
  #   build-snaps:
  #     - go/1.26/stable
  #   override-build: |
  #     craftctl default

  #     # For tab completion
  #     mkdir -p $CRAFT_PART_INSTALL/bin
  #     cp completer/snap.bash $CRAFT_PART_INSTALL/bin/snap-completer.bash
  #     ln --symbolic ./modelctl $CRAFT_PART_INSTALL/bin/smollm3
      
  cli-lspci:
    plugin: nil
    stage-packages:
      - pciutils # lspci

  # Used for NVIDIA vRAM and CUDA Capability detection.
  # Only the binary is included to avoid staging libraries, which should instead be provided by the host through the opengl interface.
  cli-nvidia-smi:
    plugin: nil
    build-packages:
      - nvidia-utils-580
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      cp /usr/bin/nvidia-smi $CRAFT_PART_INSTALL/usr/bin/
      
      license_dir=$CRAFT_PART_INSTALL/usr/share/doc/nvidia-utils-580
      mkdir -p $license_dir
      cp /usr/share/doc/nvidia-utils-580/copyright $license_dir/

  webui:
    plugin: dump
    source: https://github.com/canonical/inference-snaps-webui/releases/download/v1.1.1/inference-snaps-webui.tar.xz
    organize:
      "*": webui/

  engines:
    source: engines
    plugin: dump
    organize:
      "*": engines/

  models:
    source: models
    plugin: dump
    organize:
      "*": models/

  runtimes:
    source: runtimes
    plugin: dump
    organize:
      "*": runtimes/
  
  scripts:
    source: scripts
    plugin: dump
    stage-packages:
      - jq
    organize:
      "server.sh": bin/
      "server-webui.sh": bin/

  model-weights:
    plugin: cmake # an out-of-source plugin to reduce copies on disk
    source: model-weights
    override-build: |
      cp -rf --archive --link --no-dereference ${CRAFT_PART_SRC}/* ${CRAFT_PART_INSTALL}
    organize:
      "llamacpp/*": (component/llamacpp)
      "llamacpp-cuda/*": (component/llamacpp-cuda)
      "llamacpp-vulkan/*": (component/llamacpp-vulkan)
      "smollm3-3b-q4-k-m-gguf/*": (component/smollm3-3b-q4-k-m-gguf)
      
    prime:
      # Exclude everything not explicitly organized
      - -*

  llamacpp:
    plugin: dump
    source: 
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/b11669/llamacpp-amd64.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/b11669/llamacpp-arm64.tar.gz
    stage-packages:
      - libgomp1
    organize:
      "licenses": usr/share/doc/llama.cpp # Add licenses to the snap
      "*": (component/llamacpp)
    
  llamacpp-cuda:
    plugin: dump
    source: 
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/b11669/llamacpp-amd64+cuda12.9.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/b11669/llamacpp-arm64+cuda12.9.tar.gz
    stage-packages:
      - libgomp1
    organize:
      "licenses": usr/share/doc/llama.cpp+cuda # Add licenses to the snap
      "*": (component/llamacpp-cuda)

  llamacpp-vulkan:
    plugin: dump
    source:
      - on amd64: https://github.com/ggml-org/llama.cpp/releases/download/b11669/llama-b11669-bin-ubuntu-vulkan-x64.tar.gz
      - on arm64: https://github.com/ggml-org/llama.cpp/releases/download/b11669/llama-b11669-bin-ubuntu-vulkan-arm64.tar.gz
    stage-packages:
      - libgomp1
      - libvulkan1
      - mesa-vulkan-drivers
    override-build: |
      craftctl default
      mkdir -p ${CRAFT_PART_INSTALL}/bin ${CRAFT_PART_INSTALL}/lib
      mv ${CRAFT_PART_INSTALL}/llama* ${CRAFT_PART_INSTALL}/ggml-rpc-server ${CRAFT_PART_INSTALL}/bin/
      mv ${CRAFT_PART_INSTALL}/lib*.so* ${CRAFT_PART_INSTALL}/lib/
      for lib in ${CRAFT_PART_INSTALL}/lib/libggml-*.so; do
        [ -e "$lib" ] && ln -sf "../lib/$(basename "$lib")" "${CRAFT_PART_INSTALL}/bin/$(basename "$lib")"
      done
    organize:
      "LICENSE": usr/share/doc/llama.cpp+vulkan/LICENSE
      "*": (component/llamacpp-vulkan)

  notice:
    plugin: nil
    source: NOTICE
    source-type: file
    override-build: |
      license_dir=$CRAFT_PART_INSTALL/usr/share/doc
      mkdir -p $license_dir
      cp NOTICE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE-smollm3 $license_dir/

components:
  smollm3-3b-q4-k-m-gguf:
    type: standard
    summary: SmolLM3 3B Q4_K_M GGUF
    description: Model weights for SmolLM3 3B in GGUF format

  llamacpp:
    type: standard
    summary: llama.cpp using default CPU instruction sets
    description: LLM inference in C/C++
  
  llamacpp-cuda:
    type: standard
    summary: llama.cpp with CUDA backend
    description: LLM inference in C/C++

  llamacpp-vulkan:
    type: standard
    summary: llama.cpp with Vulkan backend
    description: LLM inference in C/C++

apps:
  smollm3:
    command: bin/modelctl
    completer: bin/snap-completer.bash
    plugs:
      - hardware-observe
      - opengl
      - network
      - desktop # To open the webui in the browser
    environment:
      ADDITIONAL_FEATURES: chat, webui

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      - network-bind
      - hardware-observe
      - opengl
      - home

  server-webui:
    command: bin/server-webui.sh
    daemon: simple
    plugs:
      - network-bind

lint:
  ignore:
    - metadata:
      - license
      - contact
