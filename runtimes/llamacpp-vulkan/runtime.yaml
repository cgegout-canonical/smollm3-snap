name: llamacpp-vulkan

servers:
  openai:
    protocol: http
    base-path: /v1

environment:
  # Add llama.cpp binaries
  - PATH=$PATH:$SNAP_COMPONENTS/llamacpp-vulkan/bin
  # Add llama.cpp-built shared libraries
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp-vulkan/lib
  # Add staged shared libraries
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp-vulkan/usr/lib/$ARCH_TRIPLET
  # Add Vulkan ICD files
  - VK_ICD_FILENAMES=$SNAP_COMPONENTS/llamacpp-vulkan/usr/share/vulkan/icd.d/intel_icd.json:$SNAP_COMPONENTS/llamacpp-vulkan/usr/share/vulkan/icd.d/intel_hasvk_icd.json

components:
  - llamacpp-vulkan
